name: Build and Push Docker Image

on:
  push:
    branches:
      - "main"
      - "master"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🚀 新增步骤：从 Dockerfile 中提取 Nginx 版本号
      - name: Extract Nginx version from Dockerfile
        id: get_nginx_version
        run: |
          # 使用 grep 和 sed 匹配 ARG NGINX_VERSION=... 后的版本号
          VERSION=$(grep -E '^\s*ARG\s+NGINX_VERSION=' Dockerfile | head -n 1 | cut -d'=' -f2 | tr -d ' "')
          echo "Extracted Nginx Version: $VERSION"
          # 将版本号存入 GitHub Actions 的步骤输出中
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/nginx
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            # 🚀 新增：将提取出来的 Nginx 版本号作为自定义 Tag
            type=raw,value=${{ steps.get_nginx_version.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            MAXMIND_ACCOUNT_ID=${{ secrets.MAXMIND_ACCOUNT_ID }}
            MAXMIND_LICENSE_KEY=${{ secrets.MAXMIND_LICENSE_KEY }}
