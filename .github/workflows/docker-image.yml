name: Build and Push Docker Image

# 触发条件：当推送到 main 分支，或者推送到以 v 开头的 tag（如 v1.0.0）时触发
on:
  push:
    branches:
      - "main"
      - "master"
    tags:
      - "v*"
  # 允许在 GitHub 页面上手动点击触发
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 QEMU（如果后续需要跨平台编译，比如同时编译 amd64 和 arm64）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. 设置 Docker Buildx（高级 Docker 构建工具，支持缓存优化等）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登录到 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. 提取元数据（自动生成镜像的标签，如 main, v1.0.0, latest 等）
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/nginx
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      # 6. 构建并推送 Docker 镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 利用 GitHub Actions 的缓存加速后续构建（避免每次都重新下载和编译没有变动的层）
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # 如果你的 nginx 库需要支持 ARM64（如飞腾、鲲鹏等平台），可以取消下面这一行的注释：
          # platforms: linux/amd64,linux/arm64
